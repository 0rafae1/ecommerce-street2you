<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street2You - As ruas que encontram você</title>
    <meta name="description"
        content="Street2You: loja de moda urbana com os melhores tênis e roupas streetwear. Encontre as últimas tendências e garanta seu estilo único. Confira!">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components/header.css">
    <link rel="stylesheet" href="./css/components/hero.css">
    <link rel="stylesheet" href="./css/components/product-category.css">
    <link rel="stylesheet" href="./css/components/product-grid.css">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicons/favicon-16x16.png">
    <link rel="manifest" href="./assets/images/favicons/site.webmanifest">
</head>

<body>
    <!-- Header com logo e navegação -->
    <header class="header">
        <h1 class="logo">
            <a href="/" title="Street2You - As ruas que encontram você">
                <img src="./assets/images/icons/logo.svg" alt="Street2You - As ruas que encontram você">
            </a>
        </h1>
        <nav class="nav-center" aria-label="Categorias Principais">
            <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>
        </nav>
        <nav class="nav-right" aria-label="Acesso rápido">
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="Minha conta">
                        <span class="nav-icon nav-icon-user"></span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ajuda">
                        <span class="nav-icon nav-icon-help"></span>
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Sacola de compras">
                        <span class="nav-icon nav-icon-cart"></span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Seção hero -->
        <section class="hero">
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Black Lynx</span>
                    <h2 class="hero-title">Dê o primeiro passo para o estilo que você busca.</h2>
                    <div class="hero-buttons">
                        <a href="#" class="btn btn-filled">Comprar</a>
                        <a href="#" class="btn btn-outline">Mais modelos</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de categorias de tênis -->
        <section class="categories">
            <div class="category-card basico">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Básico</span>
                </a>
            </div>
            <div class="category-card urbano">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Urbano</span>
                </a>
            </div>
            <div class="category-card esportivo">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Esportivo</span>
                </a>
            </div>
            <div class="category-card techwear">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Techwear</span>
                </a>
            </div>
        </section>

        <!-- Grid com produtos em destaque -->
        <section class="products-grid">
            <div class="card top1">
                <div class="top1-content">
                    <h3 class="top1-tittle">Black Lynx</h3>
                    <p class="top1-subtittle">Estilo Urbano com atitude</p>
                    <div class="cta-group">
                        <a href="#" class="btn btn-outline">Masculino</a>
                        <a href="#" class="btn btn-outline">Feminino</a>
                    </div>
                </div>
            </div>
            <div class="card top2"></div>
            <div class="card midL"></div>
            <div class="card midR"></div>
            <div class="card bottomL"></div>
            <div class="card bottomR"></div>
        </section>
    </main>

    <!-- Footer com informações de contato e links -->
    <footer class="footer">

    </footer>
</body>

</html>
